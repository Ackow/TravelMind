<svg width="480" height="135" viewBox="0 0 480 135" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Soft background hill shapes in misty sage/teal -->
  <path d="M200 125 C 230 75, 270 70, 310 100 C 340 78, 380 85, 430 120 L 450 125 L 200 125 Z" fill="#f0f6f3" opacity="0.85"/>
  <path d="M230 125 C 260 85, 300 80, 340 105 C 370 90, 400 95, 440 125 Z" fill="#e7f1ec" opacity="0.7"/>

  <!-- Minimalist pine trees in the background -->
  <g opacity="0.45" fill="#8caea0">
    <path d="M395 86 L399 94 L391 94 Z"/>
    <path d="M395 90 L400 99 L390 99 Z"/>
    <line x1="395" y1="99" x2="395" y2="103" stroke="#7a9d8f" stroke-width="1"/>
    <path d="M404 80 L408 89 L400 89 Z"/>
    <path d="M404 85 L409 95 L399 95 Z"/>
    <line x1="404" y1="95" x2="404" y2="100" stroke="#7a9d8f" stroke-width="1"/>
    <path d="M413 84 L417 92 L409 92 Z"/>
    <line x1="413" y1="92" x2="413" y2="97" stroke="#7a9d8f" stroke-width="1"/>
  </g>

  <!-- Gray dashed loop route underneath warning -->
  <path d="M248 102 C 220 102 230 118 265 118 C 315 118 340 105 365 92" stroke="#b4c2bc" stroke-width="1.8" stroke-dasharray="4 3" fill="none"/>

  <!-- Orange curved route from Red Pin to Warning Badge -->
  <path d="M48 24 C 68 26 100 58 145 68 C 175 75 210 84 246 86" stroke="#f95738" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Green curved route from Warning Badge to Green Pin -->
  <path d="M310 86 C 335 76 355 52 385 48 C 400 46 412 48 425 45" stroke="#059669" stroke-width="2.8" stroke-linecap="round" fill="none"/>

  <!-- Left Red Location Pin -->
  <g transform="translate(36, 8)">
    <ellipse cx="12" cy="24" rx="6" ry="2.5" fill="#000000" opacity="0.08"/>
    <path d="M12 2 C 7.5 2 4 5.5 4 10 C 4 15.5 12 24 12 24 C 12 24 20 15.5 20 10 C 20 5.5 16.5 2 12 2 Z" fill="#ffffff" stroke="#f95738" stroke-width="2.2"/>
    <circle cx="12" cy="10" r="3.5" fill="#f95738"/>
  </g>

  <!-- Center Circular Warning Badge -->
  <g transform="translate(278, 86)">
    <circle cx="0" cy="0" r="20" fill="#ffffff" stroke="#9ca3af" stroke-width="1.6" stroke-dasharray="4 3"/>
    <path d="M0 -11 L11 8 C11.5 9 10.8 10 9.5 10 L-9.5 10 C-10.8 10 -11.5 9 -11 8 Z" fill="#ffffff" stroke="#ea580c" stroke-width="2" stroke-linejoin="round"/>
    <line x1="0" y1="-4" x2="0" y2="2.5" stroke="#ea580c" stroke-width="2" stroke-linecap="round"/>
    <circle cx="0" cy="6.5" r="1.1" fill="#ea580c"/>
  </g>

  <!-- Right Green Location Pin -->
  <g transform="translate(415, 20)">
    <ellipse cx="12" cy="24" rx="6" ry="2.5" fill="#000000" opacity="0.08"/>
    <path d="M12 2 C 7.5 2 4 5.5 4 10 C 4 15.5 12 24 12 24 C 12 24 20 15.5 20 10 C 20 5.5 16.5 2 12 2 Z" fill="#ffffff" stroke="#059669" stroke-width="2.2"/>
    <circle cx="12" cy="10" r="3.5" fill="#059669"/>
  </g>
</svg>
